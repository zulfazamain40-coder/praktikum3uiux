<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Arial, Helvetica, sans-serif;
              }
              html, body{
                width: 100%;
                height: 100%;
                background-color: rgb(247, 247, 247);
              }
              .wrapper{
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;
                gap: 10px;
              }
                header{
                    background-color: #50636d;
                    padding:15px;
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    font-weight: bold;
                    border: 1px solid;
                }
                nav{
                    background-color: #566d94ae;
                    padding: 15px;
                    text-align:left;
                    font-weight: bold;
                    border: 1px solid;
                }
                .main-content{
                    display: flex;
                    gap: 10px;
                    flex: 1;
                }
                article{
                    flex: 3;
                    background-color: #8aa2dab3;
                    padding: 15px;
                    border: 1px solid #83839a;
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                }
                section{
                    background-color: #707287;
                    padding: 15px;
                    border: 1px solid #35353c;
                    flex: 1;
                    display: flex;
                    align-items: center;
                }
                aside{
                    flex: 1;
                    background-color: #8a9a92;
                    padding: 15px;
                    border: 1px solid #5f6e27;
                }
                footer{
                    background-color: #545f6c;
                    padding: 15px;
                    text-align: center;
                    font-weight: bold;
                    border: 1px solid;
                }


    </style>

</head>
<body>
    <div class="wrapper" >
        <header>
            <img src="mypoto.jpeg" alt="gue" width="100px" height="100px" corner-radius="50">
            <p>my website</p>

        </header>
        <nav>
            nav

        </nav>
        <div class=" main-content" >
            <article>
                article
                <section>sec</section>
                <section>sec</section>
                <section>sec</section>
            </article>

            <aside>
                aside
                
            </aside>
        </div>
        <footer>
          footer
        </footer>
    </div>
</body>
</html>
